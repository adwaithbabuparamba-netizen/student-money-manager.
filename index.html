// Indian Rupee & Number Formatting Helper
function formatINR(val, includeDecimals = false) {
  const num = Number(val) || 0;
  const isNeg = num < 0;
  const absNum = Math.abs(num);
  
  const options = {
    maximumFractionDigits: includeDecimals ? 2 : 0,
    minimumFractionDigits: includeDecimals ? 2 : 0
  };
  
  const formatted = absNum.toLocaleString('en-IN', options);
  return `${isNeg ? '-' : ''}₹${formatted}`;
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return dateStr;
  return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
}

function formatDateTime(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return dateStr;
  return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

    });

    // Process transactions sequentially
    transactions.forEach(tx => {
      const amt = Number(tx.amount) || 0;
      if (amt <= 0) return;

      switch (tx.type) {
        case 'income':
          // Income credits sourceAccountId (destination account for income)
          if (tx.sourceAccountId && balanceMap[tx.sourceAccountId] !== undefined) {
            balanceMap[tx.sourceAccountId] += amt;
          }
          break;

        case 'expense':
          // Expense debits source account
          if (tx.sourceAccountId && balanceMap[tx.sourceAccountId] !== undefined) {
            balanceMap[tx.sourceAccountId] -= amt;
          }
          break;

        case 'transfer':
          // Rule 1 & 3: Account-to-account transfer debits source and credits destination
          if (tx.sourceAccountId && balanceMap[tx.sourceAccountId] !== undefined) {
            balanceMap[tx.sourceAccountId] -= amt;
          }
          if (tx.destinationAccountId && balanceMap[tx.destinationAccountId] !== undefined) {
            balanceMap[tx.destinationAccountId] += amt;
          }
          break;

        case 'savings_deposit':
          // Rule 2 & 4: Virtual goal contribution moves funds from liquid account into goal allocation.
          // Debits source account
          if (tx.sourceAccountId && balanceMap[tx.sourceAccountId] !== undefined) {
            balanceMap[tx.sourceAccountId] -= amt;
          }
          break;

        case 'savings_withdraw':
          // Withdraws from goal back into account
          if (tx.sourceAccountId && balanceMap[tx.sourceAccountId] !== undefined) {
            balanceMap[tx.sourceAccountId] += amt;
          }
          break;

        case 'borrow':
          // Rule 8: Borrowed money increases liquid cash/bank, but creates an offsetting liability (NOT ordinary income)
          if (tx.sourceAccountId && balanceMap[tx.sourceAccountId] !== undefined) {
            balanceMap[tx.sourceAccountId] += amt;
          }
          break;

        case 'lend':
          // Lent money decreases liquid cash/bank, creates an asset (receivable), NOT an expense
          if (tx.sourceAccountId && balanceMap[tx.sourceAccountId] !== undefined) {
            balanceMap[tx.sourceAccountId] -= amt;
          }
          break;

        case 'loan_repay':
          // Rule 9: Loan repayment:
          // If we received repayment for money we lent -> credits our account
          // If we repaid money we borrowed -> debits our account
          if (tx.subType === 'borrow_repaid') {
            if (tx.sourceAccountId && balanceMap[tx.sourceAccountId] !== undefined) {
              balanceMap[tx.sourceAccountId] -= amt;
            }
          } else {
            // Default: money lent was repaid to us
            if (tx.sourceAccountId && balanceMap[tx.sourceAccountId] !== undefined) {
              balanceMap[tx.sourceAccountId] += amt;
            }
          }
          break;

        case 'refund':
          // Rule 10: Refund credits source account (offsets earlier expense)
          if (tx.sourceAccountId && balanceMap[tx.sourceAccountId] !== undefined) {
            balanceMap[tx.sourceAccountId] += amt;
          }
          break;
      }
    });

    return balanceMap;
  },

  // Calculate Net Worth:
  // Liquid Assets (Bank + Cash + Wallets) + Virtual Savings Goals + Money Lent to Others (Receivables) - Money Borrowed (Payables)
  calculateNetWorth(accounts, transactions, savingsGoals, loans) {
    const balances = this.calculateAccountBalances(accounts, transactions);
    let liquidTotal = 0;
    accounts.forEach(acc => {
      liquidTotal += (balances[acc.id] || 0);
    });

    // Total in goals
    let totalInGoals = 0;
    savingsGoals.forEach(g => {
      totalInGoals += Number(g.savedAmount) || 0;
    });

    // Loans: Lent (asset to receive) & Borrowed (liability to pay)
    let outstandingLent = 0;
    let outstandingBorrowed = 0;
    loans.forEach(l => {
      const remaining = Number(l.outstanding) || 0;
      if (l.type === 'lent') outstandingLent += remaining;
      else if (l.type === 'borrowed') outstandingBorrowed += remaining;
    });

    // Net worth = Liquid Balance + Savings in Goals + Outstanding Lent - Outstanding Borrowed
    const netWorth = liquidTotal + totalInGoals + outstandingLent - outstandingBorrowed;

    return {
      liquidTotal,
      totalInGoals,
      outstandingLent,
      outstandingBorrowed,
      netWorth
    };
  },

  // Filter transactions by Month (YYYY-MM)
  filterTransactionsByMonth(transactions, yearMonth) {
    return transactions.filter(tx => {
      if (!tx.date) return false;
      return tx.date.startsWith(yearMonth);
    });
  },

  // Monthly Cash Flow & Expense Report
  getMonthlyMetrics(transactions, yearMonth) {
    const monthTxs = this.filterTransactionsByMonth(transactions, yearMonth);
    let income = 0;
    let expenses = 0;
    let savingsDeposits = 0;
    let categoryMap = {};

    monthTxs.forEach(tx => {
      const amt = Number(tx.amount) || 0;
      if (tx.type === 'income') {
        income += amt;
      } else if (tx.type === 'expense') {
        expenses += amt;
        const cat = tx.category || 'Other';
        categoryMap[cat] = (categoryMap[cat] || 0) + amt;
      } else if (tx.type === 'refund') {
        // Refund offsets expense
        expenses = Math.max(0, expenses - amt);
      } else if (tx.type === 'savings_deposit') {
        savingsDeposits += amt;
      }
    });

    return {
      income,
      expenses,
      netCashFlow: income - expenses,
      savingsDeposits,
      categoryMap,
      transactionCount: monthTxs.length
    };
  },

  // Today & This Week Spending
  getRecentSpendingMetrics(transactions) {
    const now = new Date();
    const todayStr = now.toISOString().split('T')[0];
    
    // Start of current week (Monday)
    const dayOfWeek = now.getDay();
    const diffToMonday = (dayOfWeek + 6) % 7;
    const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - diffToMonday);
    const mondayStr = monday.toISOString().split('T')[0];

    let todaySpend = 0;
    let thisWeekSpend = 0;

    transactions.forEach(tx => {
      if (tx.type === 'expense') {
        const amt = Number(tx.amount) || 0;
        const txDate = (tx.date || '').split('T')[0];
        if (txDate === todayStr) {
          todaySpend += amt;
        }
        if (txDate >= mondayStr && txDate <= todayStr) {
          thisWeekSpend += amt;
        }
      }
    });

    return { todaySpend, thisWeekSpend };
  },

  // Rule 14: Future Balance Predictor
  // Projects cash balance for next 30 days based on:
  // Current Liquid Balance + Scheduled Income - Upcoming Bills - Active Subscriptions - Savings Commitments
  predictFutureBalance(liquidBalance, bills, subscriptions, savingsGoals, studentSettings) {
    let upcomingBillsSum = 0;
    bills.forEach(b => {
      if (b.status === 'upcoming') {
        upcomingBillsSum += Number(b.amount) || 0;
      }
    });

    let activeSubsMonthlyCost = 0;
    subscriptions.forEach(s => {
      if (s.status === 'active') {
        const p = Number(s.price) || 0;
        if (s.billingFreq === 'monthly') activeSubsMonthlyCost += p;
        else if (s.billingFreq === 'yearly') activeSubsMonthlyCost += (p / 12);
        else if (s.billingFreq === 'quarterly') activeSubsMonthlyCost += (p / 3);
        else if (s.billingFreq === 'weekly') activeSubsMonthlyCost += (p * 4.33);
      }
    });

    let monthlySavingsCommitment = 0;
    savingsGoals.forEach(g => {
      if (!g.isCompleted) {
        const c = Number(g.contributionAmount) || 0;
        if (g.contributionFreq === 'monthly') monthlySavingsCommitment += c;
        else if (g.contributionFreq === 'weekly') monthlySavingsCommitment += (c * 4.33);
        else if (g.contributionFreq === 'daily') monthlySavingsCommitment += (c * 30);
      }
    });

    const expectedMonthlyAllowance = Number(studentSettings.monthlyPocketMoney) || 0;
    
    // Projected month-end liquid balance
    const projectedBalance = liquidBalance + expectedMonthlyAllowance - upcomingBillsSum - activeSubsMonthlyCost - monthlySavingsCommitment;

    // Safe Daily Spending Calculation:
    // How many days left in the current month?
    const now = new Date();
    const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    const daysRemaining = Math.max(1, daysInMonth - now.getDate());
    
    // Net funds available for discretionary daily spending
    const availableForDailySpend = Math.max(0, liquidBalance - upcomingBillsSum - (activeSubsMonthlyCost * 0.5));
    const safeDailySpend = Math.round(availableForDailySpend / daysRemaining);

    return {
      currentLiquid: liquidBalance,
      upcomingBillsSum,
      activeSubsMonthlyCost: Math.round(activeSubsMonthlyCost),
      monthlySavingsCommitment: Math.round(monthlySavingsCommitment),
      expectedMonthlyAllowance,
      projectedBalance: Math.round(projectedBalance),
      daysRemaining,
      safeDailySpend
    };
  },

  // Calculate Subscription monthly & yearly cost
  calculateSubscriptionTotals(subscriptions) {
    let monthlyTotal = 0;
    let yearlyTotal = 0;
    let activeCount = 0;
    let trialCount = 0;

    subscriptions.forEach(sub => {
      if (sub.status === 'cancelled') return; // Cancelled excluded
      if (sub.status === 'trial') trialCount++;
      if (sub.status === 'active') activeCount++;

      const price = Number(sub.price) || 0;
      let mCost = 0;
      let yCost = 0;

      switch (sub.billingFreq) {
        case 'weekly':
          mCost = price * 4.333;
          yCost = price * 52;
          break;
        case 'monthly':
          mCost = price;
          yCost = price * 12;
          break;
        case 'quarterly':
          mCost = price / 3;
          yCost = price * 4;
          break;
        case 'yearly':
          mCost = price / 12;
          yCost = price;
          break;
        default:
          mCost = price;
          yCost = price * 12;
      }

      monthlyTotal += mCost;
      yearlyTotal += yCost;
    });

    return {
      monthlyTotal: Math.round(monthlyTotal),
      yearlyTotal: Math.round(yearlyTotal),
      activeCount,
      trialCount
    };
  },

  // Automated Tests Runner for all 14 Rules
  runAutomatedTests() {
    const results = [];

    // Helper for assertions
    function test(ruleNum, title, testFn) {
      try {
        const pass = testFn();
        results.push({ ruleNum, title, pass: !!pass, error: null });
      } catch (err) {
        results.push({ ruleNum, title, pass: false, error: err.message });
      }
    }

    // Rule 1: Account-to-account transfer does not change net worth
    test(1, "Account-to-account transfers do not alter total net worth", () => {
      const accs = [
        { id: 'a1', openingBalance: 5000 },
        { id: 'a2', openingBalance: 2000 }
      ];
      const nwBefore = FinancialEngine.calculateNetWorth(accs, [], [], []).netWorth;
      const tx = [{ id: 't1', type: 'transfer', amount: 1500, sourceAccountId: 'a1', destinationAccountId: 'a2' }];
      const nwAfter = FinancialEngine.calculateNetWorth(accs, tx, [], []).netWorth;
      return nwBefore === 7000 && nwAfter === 7000;
    });

    // Rule 2: Virtual savings goal does not create a duplicate asset
    test(2, "Virtual savings goal does not double-count net worth or count as expense", () => {
      const accs = [{ id: 'a1', openingBalance: 10000 }];
      const goals = [{ id: 'g1', savedAmount: 0 }];
      const nwBefore = FinancialEngine.calculateNetWorth(accs, [], goals, []).netWorth;
      // User moves ₹3000 into goal: debits a1, credits goal g1
      const tx = [{ id: 't1', type: 'savings_deposit', amount: 3000, sourceAccountId: 'a1', goalId: 'g1' }];
      goals[0].savedAmount = 3000;
      const nwAfter = FinancialEngine.calculateNetWorth(accs, tx, goals, []).netWorth;
      const metrics = FinancialEngine.getMonthlyMetrics(tx, '2026-10');
      // Must not count as expense, and net worth remains 10000
      return nwBefore === 10000 && nwAfter === 10000 && metrics.expenses === 0;
    });

    // Rule 3: Account transfer updates both source and destination
    test(3, "Account transfers debit source and credit destination correctly", () => {
      const accs = [{ id: 'a1', openingBalance: 1000 }, { id: 'a2', openingBalance: 500 }];
      const tx = [{ id: 't1', type: 'transfer', amount: 400, sourceAccountId: 'a1', destinationAccountId: 'a2' }];
      const balances = FinancialEngine.calculateAccountBalances(accs, tx);
      return balances['a1'] === 600 && balances['a2'] === 900;
    });

    // Rule 4: Savings contributions are not double-counted as expenses
    test(4, "Savings contributions are classified as savings assets, not operational expenses", () => {
      const tx = [{ id: 't1', type: 'savings_deposit', amount: 2000, date: '2026-10-15', sourceAccountId: 'a1' }];
      const metrics = FinancialEngine.getMonthlyMetrics(tx, '2026-10');
      return metrics.expenses === 0 && metrics.savingsDeposits === 2000;
    });

    // Rule 5: Subscription payments are not duplicated in monthly reports
    test(5, "Subscription payments link to single ledger expense entry without duplication", () => {
      const tx = [{ id: 't1', type: 'expense', amount: 59, category: 'Subscriptions', description: 'Spotify Student', date: '2026-10-15', sourceAccountId: 'a1' }];
      const metrics = FinancialEngine.getMonthlyMetrics(tx, '2026-10');
      return metrics.expenses === 59;
    });

    // Rule 6: Cancelled subscriptions do not generate future payment entries
    test(6, "Cancelled subscriptions do not incur future recurring charges", () => {
      const subs = [
        { id: 's1', price: 199, billingFreq: 'monthly', status: 'cancelled' },
        { id: 's2', price: 99, billingFreq: 'monthly', status: 'active' }
      ];
      const totals = FinancialEngine.calculateSubscriptionTotals(subs);
      return totals.monthlyTotal === 99 && totals.activeCount === 1;
    });

    // Rule 7: Scheduled bills distinguished from completed payments
    test(7, "Scheduled bills are pending liabilities and not deducted until marked paid", () => {
      const accs = [{ id: 'a1', openingBalance: 5000 }];
      const bills = [{ id: 'b1', amount: 1200, status: 'upcoming' }];
      const balances = FinancialEngine.calculateAccountBalances(accs, []);
      return balances['a1'] === 5000; // Not deducted from liquid balance yet
    });

    // Rule 8: Borrowed money principal is not ordinary income
    test(8, "Borrowed money increases cash but adds offsetting loan liability, not income", () => {
      const accs = [{ id: 'a1', openingBalance: 1000 }];
      const tx = [{ id: 't1', type: 'borrow', amount: 2000, date: '2026-10-10', sourceAccountId: 'a1' }];
      const loans = [{ id: 'l1', type: 'borrowed', amount: 2000, outstanding: 2000 }];
      const nw = FinancialEngine.calculateNetWorth(accs, tx, [], loans);
      const metrics = FinancialEngine.getMonthlyMetrics(tx, '2026-10');
      // Liquid is 3000, liability is 2000, net worth remains 1000, ordinary income is 0
      return nw.liquidTotal === 3000 && nw.outstandingBorrowed === 2000 && nw.netWorth === 1000 && metrics.income === 0;
    });

    // Rule 9: Repayments update outstanding loan balance correctly
    test(9, "Loan repayments update outstanding balance and reflect accurate cash movements", () => {
      const loan = { id: 'l1', type: 'lent', amount: 1000, outstanding: 1000 };
      // Friend repays 600
      loan.outstanding -= 600;
      return loan.outstanding === 400;
    });

    // Rule 10: Refunds and corrections update balances consistently
    test(10, "Refunds credit account and properly offset monthly expenses", () => {
      const accs = [{ id: 'a1', openingBalance: 5000 }];
      const tx = [
        { id: 't1', type: 'expense', amount: 800, date: '2026-10-05', sourceAccountId: 'a1' },
        { id: 't2', type: 'refund', amount: 800, date: '2026-10-06', sourceAccountId: 'a1' }
      ];
      const balances = FinancialEngine.calculateAccountBalances(accs, tx);
      const metrics = FinancialEngine.getMonthlyMetrics(tx, '2026-10');
      return balances['a1'] === 5000 && metrics.expenses === 0;
    });

    // Rule 11: Monthly reports respect local dates and boundaries
    test(11, "Monthly reports strictly partition transactions by calendar month boundaries", () => {
      const tx = [
        { id: 't1', type: 'expense', amount: 100, date: '2026-09-30T23:59:00' },
        { id: 't2', type: 'expense', amount: 200, date: '2026-10-01T00:01:00' }
      ];
      const sept = FinancialEngine.filterTransactionsByMonth(tx, '2026-09');
      const oct = FinancialEngine.filterTransactionsByMonth(tx, '2026-10');
      return sept.length === 1 && oct.length === 1 && oct[0].amount === 200;
    });

    // Rule 12: Input validation prevents negative amounts and duplicate entries
    test(12, "Ledger ignores negative or zero transaction amounts", () => {
      const accs = [{ id: 'a1', openingBalance: 1000 }];
      const tx = [{ id: 't1', type: 'expense', amount: -500, sourceAccountId: 'a1' }];
      const balances = FinancialEngine.calculateAccountBalances(accs, tx);
      return balances['a1'] === 1000;
    });

    // Rule 13: Every balance is derived consistently from opening balances and recorded transactions
    test(13, "Every account balance is mathematically provable from ledger transactions", () => {
      const accs = [{ id: 'a1', openingBalance: 2000 }];
      const tx = [
        { id: 't1', type: 'income', amount: 1000, sourceAccountId: 'a1' },
        { id: 't2', type: 'expense', amount: 450, sourceAccountId: 'a1' }
      ];
      const balances = FinancialEngine.calculateAccountBalances(accs, tx);
      return balances['a1'] === 2550;
    });

    // Rule 14: Clear distinction between actual, pending, and projected balances
    test(14, "Distinguishes current liquid balance from upcoming commitments and projected balance", () => {
      const pred = FinancialEngine.predictFutureBalance(10000, [{ amount: 2000, status: 'upcoming' }], [{ price: 500, billingFreq: 'monthly', status: 'active' }], [], { monthlyPocketMoney: 0 });
      return pred.currentLiquid === 10000 && pred.upcomingBillsSum === 2000 && pred.projectedBalance === 7500;
    });

    return results;
  }
};

function initDashboardCharts(metrics) {
  // Category Doughnut Chart
  const ctxCat = document.getElementById('categoryChart');
  if (ctxCat) {
    if (dashboardCharts.category) dashboardCharts.category.destroy();
    
    const categories = Object.keys(metrics.categoryMap);
    const dataVals = Object.values(metrics.categoryMap);

    if (categories.length === 0) {
      categories.push('No Expenses');
      dataVals.push(1);
    }

    const palette = ['#f43f5e', '#f59e0b', '#3b82f6', '#10b981', '#8b5cf6', '#ec4899', '#06b6d4'];

    dashboardCharts.category = new Chart(ctxCat, {
      type: 'doughnut',
      data: {
        labels: categories,
        datasets: [{
          data: dataVals,
          backgroundColor: palette.slice(0, categories.length),
          borderWidth: 2,
          borderColor: '#1e293b'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'bottom',
            labels: { color: '#94a3b8', font: { size: 11, family: 'Inter' } }
          }
        },
        cutout: '65%'
      }
    });
  }

  // Cash Flow Bar Chart
  const ctxFlow = document.getElementById('cashflowChart');
  if (ctxFlow) {
    if (dashboardCharts.cashflow) dashboardCharts.cashflow.destroy();

    dashboardCharts.cashflow = new Chart(ctxFlow, {
      type: 'bar',
      data: {
        labels: ['Income', 'Expenses', 'Net Cash'],
        datasets: [{
          label: 'Amount (₹)',
          data: [metrics.income, metrics.expenses, metrics.netCashFlow],
          backgroundColor: ['#10b981', '#f43f5e', '#3b82f6'],
          borderRadius: 8
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false }
        },
        scales: {
          y: {
            ticks: { color: '#94a3b8', font: { size: 10 } },
            grid: { color: 'rgba(148, 163, 184, 0.1)' }
          },
          x: {
            ticks: { color: '#94a3b8', font: { size: 11 } },
            grid: { display: false }
          }
        }
      }
    });
  }
}

function renderTransactionRow(tx) {
  let isPositive = false;
  let sign = '-';
  let badgeClass = 'text-rose-400 bg-rose-500/10 border-rose-500/20';
  let iconName = 'arrow-up-right';

  if (tx.type === 'income') {
    isPositive = true;
    sign = '+';
    badgeClass = 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20';
    iconName = 'arrow-down-left';
  } else if (tx.type === 'transfer') {
    sign = '⇄';
    badgeClass = 'text-blue-400 bg-blue-500/10 border-blue-500/20';
    iconName = 'arrow-left-right';
  } else if (tx.type === 'savings_deposit') {
    sign = '🎯';
    badgeClass = 'text-purple-400 bg-purple-500/10 border-purple-500/20';
    iconName = 'target';
  } else if (tx.type === 'borrow') {
    sign = '📥';
    badgeClass = 'text-amber-400 bg-amber-500/10 border-amber-500/20';
    iconName = 'hand-coins';
  } else if (tx.type === 'lend') {
    sign = '📤';
    badgeClass = 'text-amber-400 bg-amber-500/10 border-amber-500/20';
    iconName = 'hand-coins';
  } else if (tx.type === 'refund') {
    isPositive = true;
    sign = '+';
    badgeClass = 'text-teal-400 bg-teal-500/10 border-teal-500/20';
    iconName = 'refresh-cw';
  }

  const acc = APP.data.accounts.find(a => a.id === tx.sourceAccountId);
  const accName = acc ? acc.name : 'Account';

  return `
    <div class="py-3 flex items-center justify-between hover:bg-slate-700/20 px-2 rounded-xl transition">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0 border ${badgeClass}">
          <i data-lucide="${iconName}" class="w-4 h-4"></i>
        </div>
        <div>
          <div class="font-semibold text-xs sm:text-sm text-white">${tx.description || tx.category}</div>
          <div class="text-[10px] sm:text-[11px] text-slate-400 flex items-center gap-1.5 flex-wrap">
            <span>${formatDate(tx.date)}</span>
            <span>•</span>
            <span class="text-slate-300">${accName}</span>
            <span>•</span>
            <span class="bg-slate-800 text-slate-300 px-1.5 py-0.2 rounded">${tx.category || 'General'}</span>
          </div>
        </div>
      </div>
      <div class="text-right">
        <div class="font-bold text-xs sm:text-sm ${isPositive ? 'text-emerald-400' : (tx.type === 'transfer' ? 'text-blue-400' : 'text-slate-200')}">
          ${sign} ${formatINR(tx.amount)}
        </div>
        <div class="text-[10px] text-slate-400 uppercase">${tx.type.replace('_', ' ')}</div>
      </div>
    </div>
  `;
}

let txFilterState = {
  type: 'all',
  account: 'all',
  category: 'all',
  search: ''
};

function renderTransactions() {
  const container = document.getElementById('mainContainer');
  
  // Apply filters
  let filtered = APP.data.transactions.filter(tx => {
    if (txFilterState.type !== 'all' && tx.type !== txFilterState.type) return false;
    if (txFilterState.account !== 'all' && tx.sourceAccountId !== txFilterState.account && tx.destinationAccountId !== txFilterState.account) return false;
    if (txFilterState.category !== 'all' && tx.category !== txFilterState.category) return false;
    if (txFilterState.search) {
      const q = txFilterState.search.toLowerCase();
      const matchDesc = (tx.description || '').toLowerCase().includes(q);
      const matchCat = (tx.category || '').toLowerCase().includes(q);
      const matchNotes = (tx.notes || '').toLowerCase().includes(q);
      if (!matchDesc && !matchCat && !matchNotes) return false;
    }
    return true;
  });

  // Sort descending by date
  filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

  // Compute categories list
  const categories = [...new Set(APP.data.transactions.map(t => t.category).filter(Boolean))];

  container.innerHTML = `
    <div class="space-y-4">
      <!-- Header with Action -->
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 bg-slate-800/60 p-4 rounded-2xl border border-slate-700/60">

          <h3 class="font-bold text-lg text-white" data-i18n="nav_transactions">Transactions Ledger</h3>
          <p class="text-xs text-slate-400">Total ${APP.data.transactions.length} records • Filtered ${filtered.length}</p>
        </div>
        <button onclick="openTransactionModal('expense')" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-semibold text-xs shadow-md transition active:scale-95">
          <i data-lucide="plus" class="w-4 h-4"></i> Add Transaction
        </button>
      </div>

      <!-- Filter Controls Bar -->
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2.5 bg-slate-800/40 p-3 rounded-2xl border border-slate-700/40 text-xs">
        <!-- Search input -->
        <div>
          <input type="text" id="txSearchInput" placeholder="Search description, notes..." value="${txFilterState.search}" 
            oninput="handleTxSearch(this.value)"
            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white placeholder-slate-500 focus:outline-none focus:border-brand-500" />
        </div>

        <!-- Type filter -->
        <div>
          <select onchange="handleTxFilter('type', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-brand-500">
            <option value="all" ${txFilterState.type === 'all' ? 'selected' : ''}>All Types</option>
            <option value="income" ${txFilterState.type === 'income' ? 'selected' : ''}>Income</option>
            <option value="expense" ${txFilterState.type === 'expense' ? 'selected' : ''}>Expense</option>
            <option value="transfer" ${txFilterState.type === 'transfer' ? 'selected' : ''}>Account Transfer</option>
            <option value="savings_deposit" ${txFilterState.type === 'savings_deposit' ? 'selected' : ''}>Savings Deposit</option>
            <option value="borrow" ${txFilterState.type === 'borrow' ? 'selected' : ''}>Borrowed Money</option>
            <option value="lend" ${txFilterState.type === 'lend' ? 'selected' : ''}>Lent Money</option>
            <option value="refund" ${txFilterState.type === 'refund' ? 'selected' : ''}>Refund / Correction</option>
          </select>
        </div>

        <!-- Account filter -->
        <div>
          <select onchange="handleTxFilter('account', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-brand-500">
            <option value="all" ${txFilterState.account === 'all' ? 'selected' : ''}>All Accounts</option>
            ${APP.data.accounts.map(a => `<option value="${a.id}" ${txFilterState.account === a.id ? 'selected' : ''}>${a.name}</option>`).join('')}
          </select>
        </div>

        <!-- Category filter -->
        <div>
          <select onchange="handleTxFilter('category', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-brand-500">

      <!-- Transactions List Table -->

        ${filtered.length === 0 ? `

                </div>

                <!-- Right Side: Amount and Actions -->
                <div class="flex items-center gap-2 sm:gap-4 shrink-0">
                  <div class="text-right">
                    <div class="font-bold text-xs sm:text-sm ${getTxAmountColor(tx.type)}">
                      ${getTxAmountPrefix(tx.type)} ${formatINR(tx.amount)}
                    </div>
                    <div class="text-[10px] text-slate-500 uppercase tracking-wider">${tx.type.replace('_', ' ')}</div>
                  </div>

                  <!-- Actions Dropdown / Buttons -->
                  <div class="flex items-center gap-1">
                    <button onclick="duplicateTransaction('${tx.id}')" class="p-1.5 rounded-lg bg-slate-700/60 hover:bg-slate-700 text-slate-300" title="Duplicate">
                      <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                    </button>
                    <button onclick="openEditTransactionModal('${tx.id}')" class="p-1.5 rounded-lg bg-slate-700/60 hover:bg-slate-700 text-slate-300" title="Edit">
                      <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>

  setTimeout(() => lucide.createIcons(), 50);

function handleTxFilter(key, val) {
  txFilterState[key] = val;
  renderTransactions();
}

function handleTxSearch(val) {
  txFilterState.search = val;
  renderTransactions();
}

function getAccountName(id) {
  const acc = APP.data.accounts.find(a => a.id === id);
  return acc ? acc.name : 'Unknown Account';
}

function getTxBadgeClass(type) {
  switch (type) {
    case 'income': return 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20';
    case 'expense': return 'text-rose-400 bg-rose-500/10 border-rose-500/20';
    case 'transfer': return 'text-blue-400 bg-blue-500/10 border-blue-500/20';
    case 'savings_deposit': return 'text-purple-400 bg-purple-500/10 border-purple-500/20';
    case 'savings_withdraw': return 'text-indigo-400 bg-indigo-500/10 border-indigo-500/20';
    case 'borrow': return 'text-amber-400 bg-amber-500/10 border-amber-500/20';
    case 'lend': return 'text-amber-400 bg-amber-500/10 border-amber-500/20';
    case 'refund': return 'text-teal-400 bg-teal-500/10 border-teal-500/20';
    default: return 'text-slate-400 bg-slate-500/10 border-slate-500/20';
  }
}

function getTxIcon(type) {
  switch (type) {
    case 'income': return 'arrow-down-left';
    case 'expense': return 'arrow-up-right';
    case 'transfer': return 'arrow-left-right';
    case 'savings_deposit': return 'target';
    case 'savings_withdraw': return 'wallet';
    case 'borrow': return 'hand-coins';
    case 'lend': return 'hand-coins';
    case 'refund': return 'refresh-cw';
    default: return 'circle';
  }
}

function getTxAmountColor(type) {
  if (type === 'income' || type === 'refund') return 'text-emerald-400';
  if (type === 'transfer') return 'text-blue-400';
  if (type === 'savings_deposit') return 'text-purple-400';
  return 'text-rose-400';
}

function getTxAmountPrefix(type) {
  if (type === 'income' || type === 'refund') return '+';
  if (type === 'transfer') return '⇄';
  if (type === 'savings_deposit') return '🎯';
  return '-';
}

function setTxFormType(type) {
  document.getElementById('formTxType').value = type;

  const btnInc = document.getElementById('btnTypeIncome');
  const btnTrf = document.getElementById('btnTypeTransfer');
  const destContainer = document.getElementById('destAccountContainer');
  const catContainer = document.getElementById('categoryFieldContainer');
  const lblSource = document.getElementById('lblSourceAccount');

  btnExp.className = `py-2 rounded-xl border font-semibold transition ${type === 'expense' ? 'bg-rose-500/20 border-rose-500 text-rose-300' : 'bg-slate-800 border-slate-700 text-slate-400'}`;
  btnInc.className = `py-2 rounded-xl border font-semibold transition ${type === 'income' ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300' : 'bg-slate-800 border-slate-700 text-slate-400'}`;
  btnTrf.className = `py-2 rounded-xl border font-semibold transition ${type === 'transfer' ? 'bg-blue-500/20 border-blue-500 text-blue-300' : 'bg-slate-800 border-slate-700 text-slate-400'}`;

  if (type === 'transfer') {
    destContainer.classList.remove('hidden');
    catContainer.classList.add('hidden');
    lblSource.textContent = "From Account";
  } else if (type === 'income') {
    destContainer.classList.add('hidden');
    catContainer.classList.remove('hidden');
    lblSource.textContent = "Deposit Into Account";
  } else {
    destContainer.classList.add('hidden');
    catContainer.classList.remove('hidden');
    lblSource.textContent = "Pay From Account";
  }
}

function saveTransaction(e) {
  e.preventDefault();
  const id = document.getElementById('formTxId').value;
  const type = document.getElementById('formTxType').value;
  const amount = Number(document.getElementById('formTxAmount').value);
  const desc = document.getElementById('formTxDesc').value.trim();
  const cat = document.getElementById('formTxCategory').value;
  const sourceAcc = document.getElementById('formTxSourceAccount').value;
  const destAcc = document.getElementById('formTxDestAccount').value;
  const date = document.getElementById('formTxDate').value;
  const notes = document.getElementById('formTxNotes').value.trim();

  // Rule 12: Validate positive amount
  if (amount <= 0 || isNaN(amount)) {
    showToast("Invalid amount. Must be greater than 0.", "error");
    return;
  }

  // Transfer validation: source != dest
  if (type === 'transfer' && sourceAcc === destAcc) {
    showToast("Source and destination accounts cannot be the same.", "error");
    return;
  }

  if (id) {
    // Edit existing
    const idx = APP.data.transactions.findIndex(t => t.id === id);
    if (idx !== -1) {
      APP.data.transactions[idx] = {
        ...APP.data.transactions[idx],
        type,
        amount,
        description: desc,
        category: type === 'transfer' ? 'Transfer' : cat,
        sourceAccountId: sourceAcc,
        destinationAccountId: type === 'transfer' ? destAcc : null,
        date: new Date(date).toISOString(),
        notes
      };
      showToast(t('tx_updated_success'), 'success');
    }
  } else {
    // Check duplicate-entry protection within last 3 minutes
    const duplicate = APP.data.transactions.find(t => 
      t.amount === amount && 
      t.description === desc && 
      t.sourceAccountId === sourceAcc &&
      Math.abs(new Date(t.date).getTime() - new Date(date).getTime()) < 180000
    );
    if (duplicate && !window._allowDuplicateEntry) {
      showConfirmDialog(
        "Possible Duplicate Transaction",
        "A similar transaction with this amount was recorded recently. Add anyway?",
        () => {
          window._allowDuplicateEntry = true;
          document.getElementById('txForm').dispatchEvent(new Event('submit', { cancelable: true }));
          window._allowDuplicateEntry = false;
        }
      );
      return;
    }

    const newTx = {
      id: 'tx_' + Date.now(),
      type,
      amount,
      description: desc,
      category: type === 'transfer' ? 'Transfer' : cat,
      sourceAccountId: sourceAcc,
      destinationAccountId: type === 'transfer' ? destAcc : null,
      date: new Date(date).toISOString(),
      notes,
      tags: []
    };
    APP.data.transactions.unshift(newTx);
    showToast(t('tx_added_success'), 'success');
  }

  Storage.save(APP.data);
  closeModal();
  refreshCurrentView();
}

function openEditTransactionModal(id) {
  const tx = APP.data.transactions.find(t => t.id === id);
  if (!tx) return;

  openTransactionModal(tx.type);
  document.getElementById('formTxId').value = tx.id;
  document.getElementById('formTxAmount').value = tx.amount;
  document.getElementById('formTxDesc').value = tx.description || '';
  document.getElementById('formTxCategory').value = tx.category || 'Other';
  document.getElementById('formTxSourceAccount').value = tx.sourceAccountId || '';
  if (tx.destinationAccountId) {
    document.getElementById('formTxDestAccount').value = tx.destinationAccountId;
  }
  if (tx.date) {
    document.getElementById('formTxDate').value = new Date(tx.date).toISOString().slice(0, 16);
  }
  document.getElementById('formTxNotes').value = tx.notes || '';
  setTxFormType(tx.type);
}

function duplicateTransaction(id) {
  const tx = APP.data.transactions.find(t => t.id === id);
  if (!tx) return;

  const clone = {
    ...tx,
    id: 'tx_' + Date.now(),
    date: new Date().toISOString(),
    description: `${tx.description} (Copy)`
  };
  APP.data.transactions.unshift(clone);
  Storage.save(APP.data);
  showToast("Transaction duplicated!", "info");
  refreshCurrentView();
}

function confirmDeleteTransaction(id) {
  showConfirmDialog(
    t('confirm_delete'),
    t('confirm_delete_desc'),
    () => {
      APP.data.transactions = APP.data.transactions.filter(t => t.id !== id);
      Storage.save(APP.data);
      showToast(t('tx_deleted_success'), 'info');
      refreshCurrentView();
    }
  );
}

function saveReconciliation(accId, recordedBal) {
  const actualVal = Number(document.getElementById('reconcileActualVal').value);
  const reason = document.getElementById('reconcileReason').value.trim() || 'Balance reconciliation';

  if (isNaN(actualVal)) {
    showToast("Please enter a valid actual balance.", "error");
    return;
  }

  const diff = actualVal - recordedBal;
  if (Math.abs(diff) < 0.01) {
    showToast("Ledger is already perfectly balanced with actual balance!", "info");
    closeModal();
    return;
  }

  if (diff > 0) {
    // Upward adjustment -> income or correction
    APP.data.transactions.unshift({
      id: 'tx_' + Date.now(),
      type: 'refund',
      amount: diff,
      description: `Reconciliation adjustment (${reason})`,
      category: 'Correction',
      sourceAccountId: accId,
      date: new Date().toISOString(),
      notes: `Adjusted ledger balance from ₹${recordedBal} to ₹${actualVal}`
    });
  } else {
    // Downward adjustment -> expense or correction
    APP.data.transactions.unshift({
      id: 'tx_' + Date.now(),
      type: 'expense',
      amount: Math.abs(diff),
      description: `Reconciliation adjustment (${reason})`,
      category: 'Correction',
      sourceAccountId: accId,
      date: new Date().toISOString(),
      notes: `Adjusted ledger balance from ₹${recordedBal} to ₹${actualVal}`
    });
  }

  Storage.save(APP.data);
  closeModal();
  showToast("Account reconciled with adjustment transaction!", "success");
  refreshCurrentView();
}

function recalculateIPhoneTarget() {
  const price = Number(document.getElementById('calcTargetPrice')?.value) || 30000;
  const existing = Number(document.getElementById('calcExistingSavings')?.value) || 0;
  const contribVal = Number(document.getElementById('calcContributionVal')?.value) || 4000;
  const freq = document.getElementById('calcFreqSelect')?.value || 'monthly';
  const targetDateStr = document.getElementById('calcTargetDate')?.value;

  const remaining = Math.max(0, price - existing);
  const remainingEl = document.getElementById('calcResRemaining');
  if (remainingEl) remainingEl.textContent = formatINR(remaining);

  // If deadline is picked, calculate required daily and monthly savings
  if (targetDateStr) {
    const now = new Date();
    const target = new Date(targetDateStr);
    const diffTime = target.getTime() - now.getTime();
    const diffDays = Math.max(1, Math.ceil(diffTime / (1000 * 60 * 60 * 24)));
    const diffMonths = Math.max(0.5, diffDays / 30.4);

    const reqDaily = Math.round(remaining / diffDays);
    const reqMonthly = Math.round(remaining / diffMonths);

    const dailyEl = document.getElementById('calcResDaily');
    const monthlyEl = document.getElementById('calcResMonthly');
    const dateEl = document.getElementById('calcResDate');

    if (dailyEl) dailyEl.textContent = `${formatINR(reqDaily)}/day`;
    if (monthlyEl) monthlyEl.textContent = `${formatINR(reqMonthly)}/mo`;
    if (dateEl) dateEl.textContent = formatDate(targetDateStr);
  }
}

  goal.isCompleted = false;
  goal.history = goal.history || [];
  goal.history.push({ date: new Date().toISOString(), amount, type: 'withdrawal', note: reason });

  // Record transaction in destination account
  APP.data.transactions.unshift({

    type: 'savings_withdraw',
    amount,
    description: `Goal Withdrawal: ${goal.name}`,
    category: 'Savings Withdrawal',

function markSubscriptionPaid(subId) {
  const sub = APP.data.subscriptions.find(s => s.id === subId);
  if (!sub) return;

  // Add transaction to ledger (Rule 5: No double count)
  APP.data.transactions.unshift({
    id: 'tx_' + Date.now(),
    type: 'expense',
    amount: sub.price,
    description: `Subscription: ${sub.name}`,
    category: 'Subscriptions',
    sourceAccountId: sub.accountId,
    date: new Date().toISOString(),
    notes: `Recurring payment for ${sub.billingFreq}`
  });

  // Advance next payment date
  const nextDate = new Date(sub.nextPaymentDate);
  if (sub.billingFreq === 'monthly') nextDate.setMonth(nextDate.getMonth() + 1);
  else if (sub.billingFreq === 'yearly') nextDate.setFullYear(nextDate.getFullYear() + 1);
  else if (sub.billingFreq === 'quarterly') nextDate.setMonth(nextDate.getMonth() + 3);
  else if (sub.billingFreq === 'weekly') nextDate.setDate(nextDate.getDate() + 7);

  sub.nextPaymentDate = nextDate.toISOString().split('T')[0];
  Storage.save(APP.data);
  showToast(`Recorded payment of ${formatINR(sub.price)} for ${sub.name}!`, "success");
  refreshCurrentView();
}

function toggleSubscriptionStatus(subId) {
  const sub = APP.data.subscriptions.find(s => s.id === subId);
  if (!sub) return;

  if (sub.status === 'active') sub.status = 'paused';
  else if (sub.status === 'paused') sub.status = 'cancelled';
  else sub.status = 'active';

  Storage.save(APP.data);
  showToast(`${sub.name} is now ${sub.status}`, "info");
  renderSubscriptions();
}

function deleteSubscription(subId) {
  showConfirmDialog("Delete Subscription?", "This subscription will be removed from your recurring commitments.", () => {
    APP.data.subscriptions = APP.data.subscriptions.filter(s => s.id !== subId);

function payBill(billId) {

    description: `Bill Payment: ${b.name}`,

    sourceAccountId: b.accountId,
    date: new Date().toISOString(),
    notes: `Paid on ${formatDate(new Date().toISOString())}`
  });

  b.status = 'paid';
  Storage.save(APP.data);
  showToast(`Paid ${formatINR(b.amount)} for ${b.name}!`, "success");
  refreshCurrentView();
}

function reopenBill(billId) {
  const b = APP.data.bills.find(item => item.id === billId);
  if (!b) return;
  b.status = 'upcoming';
  Storage.save(APP.data);
  renderBills();
}

function deleteBill(billId) {

function saveNewLoan(e) {
  e.preventDefault();
  const type = document.getElementById('loanFormType').value;
  const person = document.getElementById('loanPerson').value.trim();
  const amount = Number(document.getElementById('loanAmount').value);
  const dueDate = document.getElementById('loanDueDate').value;
  const acc = document.getElementById('loanAcc').value;
  const notes = document.getElementById('loanNotes').value.trim();

  // Create loan entry
  const newLoan = {
    id: 'loan_' + Date.now(),
    type,
    person,
    amount,
    outstanding: amount,
    date: new Date().toISOString(),
    dueDate,
    notes,
    repayments: []
  };
  APP.data.loans.push(newLoan);

  // Add ledger transaction to update account balance (Rule 8)
  APP.data.transactions.unshift({
    id: 'tx_' + Date.now(),
    type: type === 'lent' ? 'lend' : 'borrow',
    amount,
    description: `${type === 'lent' ? 'Lent to' : 'Borrowed from'} ${person}`,
    category: 'Loan',
    sourceAccountId: acc,
    date: new Date().toISOString(),
    loanPerson: person,
    notes
  });

  Storage.save(APP.data);
  closeModal();
  showToast("Loan recorded successfully!", "success");
  refreshCurrentView();
}

function openRepaymentModal(loanId) {
  const loan = APP.data.loans.find(l => l.id === loanId);
  if (!loan) return;

  const modalHost = document.getElementById('modalHost');
  modalHost.innerHTML = `

        </button>

        <div>
          <label class="block text-slate-400 mb-1 font-medium">Outstanding Balance</label>
          <div class="text-base font-bold text-white">${formatINR(loan.outstanding)}</div>
        </div>

        <div>
          <label class="block text-slate-400 mb-1 font-medium">Repayment Amount (₹)</label>
          <input type="number" step="0.01" min="1" max="${loan.outstanding}" id="repayAmount" value="${loan.outstanding}" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white font-bold focus:outline-none focus:border-brand-500" />
        </div>

        <div>
          <label class="block text-slate-400 mb-1 font-medium">Account for Funds</label>
          <select id="repayAcc" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-brand-500">
            ${APP.data.accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join('')}
          </select>
        </div>

        <div>
          <label class="block text-slate-400 mb-1 font-medium">Notes</label>
          <input type="text" id="repayNotes" placeholder="e.g. GPay repayment, cash handover" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-brand-500" />
        </div>

        <div class="flex items-center justify-end gap-2 pt-3 border-t border-slate-800">
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium transition">Cancel</button>
          <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold transition active:scale-95 shadow">Confirm Repayment</button>
        </div>
      </form>
    </div>
  `;
  modalHost.classList.remove('hidden');
  lucide.createIcons();
}

function saveLoanRepayment(e, loanId) {
  e.preventDefault();
  const loan = APP.data.loans.find(l => l.id === loanId);
  const amount = Number(document.getElementById('repayAmount').value);
  const acc = document.getElementById('repayAcc').value;
  const notes = document.getElementById('repayNotes').value.trim() || 'Loan Repayment';

  if (!loan || amount <= 0 || amount > loan.outstanding) {
    showToast("Invalid repayment amount.", "error");
    return;
  }

  loan.outstanding -= amount;
  loan.repayments = loan.repayments || [];
  loan.repayments.push({ date: new Date().toISOString(), amount, note: notes });

  // Update ledger (Rule 9)
  APP.data.transactions.unshift({
    id: 'tx_' + Date.now(),
    type: 'loan_repay',
    subType: loan.type === 'borrowed' ? 'borrow_repaid' : 'lent_repaid',
    amount,
    description: `Loan Repayment (${loan.person})`,
    category: 'Loan Repayment',
    sourceAccountId: acc,
    date: new Date().toISOString(),
    notes
  });

  Storage.save(APP.data);
  closeModal();
  showToast(`Recorded repayment of ${formatINR(amount)}!`, "success");
  refreshCurrentView();
}

function deleteLoan(loanId) {
  showConfirmDialog("Delete Loan Record?", "This will remove the loan entry.", () => {
    APP.data.loans = APP.data.loans.filter(l => l.id !== loanId);
    Storage.save(APP.data);
    showToast("Loan removed.", "info");
    renderBorrowLend();
  });
}
</script>

function recalcBusPass() {
  const ticket = Number(document.getElementById('busTicketInput').value) || 0;
  const pass = Number(document.getElementById('busPassInput').value) || 0;
  const regCost = ticket * 2 * 24;
  const savings = Math.max(0, regCost - pass);

  document.getElementById('busRegularCost').textContent = formatINR(regCost);
  document.getElementById('busPassCost').textContent = formatINR(pass);
  document.getElementById('busSavingsCost').textContent = formatINR(savings);
}

function recalcSplitBill() {
  const total = Number(document.getElementById('splitBillTotal').value) || 0;
  const people = Math.max(1, Number(document.getElementById('splitBillPeople').value) || 1);
  const share = Math.round(total / people);
  document.getElementById('splitShareAmount').textContent = formatINR(share);
}

function convertSplitToLoan() {
  const total = Number(document.getElementById('splitBillTotal').value) || 0;
  const people = Math.max(1, Number(document.getElementById('splitBillPeople').value) || 1);
  const share = Math.round(total / people);
  const lentTotal = total - share; // Others' share

  openNewLoanModal();
  document.getElementById('loanAmount').value = lentTotal;
  document.getElementById('loanNotes').value = `Split bill share (${people - 1} classmates)`;
}

function initPredictorChart(prediction) {
  const ctx = document.getElementById('predictorChart');
  if (!ctx) return;
  if (predictorChartInstance) predictorChartInstance.destroy();

  // Generate 30 days forecast data points
  const labels = [];
  const balancePoints = [];
  let cur = prediction.currentLiquid;
  const dailySpend = prediction.safeDailySpend;

  for (let i = 0; i <= 30; i += 3) {
    labels.push(`Day ${i}`);
    balancePoints.push(Math.round(cur));
    cur = Math.max(0, cur - (dailySpend * 3));
  }

  predictorChartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: 'Projected Balance (₹)',
        data: balancePoints,
        borderColor: '#3b82f6',
        backgroundColor: 'rgba(59, 130, 246, 0.1)',
        fill: true,
        tension: 0.3,
        pointBackgroundColor: '#3b82f6',
        pointRadius: 4
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: '#94a3b8', font: { size: 11, family: 'Inter' } } }
      },
      scales: {
        y: {
          ticks: { color: '#94a3b8', font: { size: 10 } },
          grid: { color: 'rgba(148, 163, 184, 0.1)' }
        },
        x: {
          ticks: { color: '#94a3b8', font: { size: 10 } },
          grid: { display: false }
        }
      }
    }
  });
}

  const threshold = Number(document.getElementById('budgetThreshold').value) || 80;

  const newB = {
    id: 'b_' + Date.now(),
    category: cat,
    amount: limit,
    period,
    warningThreshold: threshold
  };

  APP.data.budgets.push(newB);
  Storage.save(APP.data);
  closeModal();
  showToast("Budget created successfully!", "success");
  renderBudgets();
}

function exportTransactionsCSV() {
  const headers = ['ID', 'Date', 'Type', 'Amount', 'Category', 'Description', 'Source Account', 'Destination Account', 'Notes'];
  const rows = APP.data.transactions.map(t => [
    t.id,
    t.date,
    t.type,
    t.amount,
    `"${(t.category || '').replace(/"/g, '""')}"`,
    `"${(t.description || '').replace(/"/g, '""')}"`,
    getAccountName(t.sourceAccountId),
    t.destinationAccountId ? getAccountName(t.destinationAccountId) : '',
    `"${(t.notes || '').replace(/"/g, '""')}"`
  ]);

  const csvContent = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `student_money_manager_transactions_${new Date().toISOString().split('T')[0]}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("CSV file exported successfully!", "success");
}

            <li>Initialize Capacitor: <code class="text-brand-400">npm init @capacitor/app</code></li>
            <li>Copy <code class="text-slate-200">index.html</code> into the web directory (<code class="text-slate-200">www</code> or <code class="text-slate-200">dist</code>).</li>
            <li>Add Android platform: <code class="text-brand-400">npx cap add android</code></li>
            <li>Build and run in Android Studio: <code class="text-brand-400">npx cap open android</code></li>
            <li>Select <strong>Build Bundle(s) / APK(s) ➔ Build APK</strong> to generate your installable APK!</li>
          </ol>
        </div>
      </div>
    </div>
  `;

  setTimeout(() => lucide.createIcons(), 50);
}

function setLanguage(lang) {
  APP.lang = lang;
  Storage.saveSettings({ lang: APP.lang, theme: APP.theme, pin: APP.pin });
  document.getElementById('currentLangLabel').textContent = lang === 'ml' ? 'മല' : 'EN';
  refreshCurrentView();
}

function setTheme(theme) {
  APP.theme = theme;
  Storage.saveSettings({ lang: APP.lang, theme: APP.theme, pin: APP.pin });
  applyTheme();
  refreshCurrentView();
}

function togglePinModal() {
  if (APP.pin) {
    showConfirmDialog("Disable Security PIN?", "Anyone with access to your browser will be able to view the ledger.", () => {
      APP.pin = null;
      Storage.saveSettings({ lang: APP.lang, theme: APP.theme, pin: null });
      showToast("Security PIN disabled.", "info");
      renderSettings();
    });
  } else {
    const modalHost = document.getElementById('modalHost');
    modalHost.innerHTML = `
      <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-sm w-full p-5 shadow-2xl space-y-4">
        <div class="flex items-center justify-between pb-3 border-b border-slate-800">
          <h3 class="font-bold text-sm text-white">Set 4-Digit Security PIN</h3>
          <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>

        <div class="space-y-3 text-xs">
          <div>
            <label class="block text-slate-400 mb-1 font-medium">Enter 4-Digit PIN</label>
            <input type="password" maxlength="4" id="newPinInput" placeholder="••••" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white font-bold text-center text-lg tracking-widest focus:outline-none focus:border-brand-500" />
          </div>

          <div class="flex items-center justify-end gap-2 pt-2">
            <button onclick="closeModal()" class="px-3 py-1.5 bg-slate-800 text-slate-300 rounded-xl">Cancel</button>
            <button onclick="savePin()" class="px-4 py-1.5 bg-brand-600 text-white font-semibold rounded-xl">Activate PIN</button>
          </div>
        </div>
      </div>
    `;
    modalHost.classList.remove('hidden');
    lucide.createIcons();
  }
}

function savePin() {
  const pin = document.getElementById('newPinInput').value;
  if (/^\d{4}$/.test(pin)) {
    APP.pin = pin;
    Storage.saveSettings({ lang: APP.lang, theme: APP.theme, pin });
    closeModal();
    showToast("4-digit PIN enabled successfully!", "success");
    renderSettings();
  } else {
    showToast("PIN must be exactly 4 digits.", "error");
  }
}

function exportJSONBackup() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(APP.data, null, 2));
  const dlAnchor = document.createElement('a');
  dlAnchor.setAttribute("href", dataStr);
  dlAnchor.setAttribute("download", `student_money_manager_backup_${new Date().toISOString().split('T')[0]}.json`);
  document.body.appendChild(dlAnchor);
  dlAnchor.click();
  dlAnchor.remove();
  showToast(t('backup_downloaded'), "success");
}

function importJSONBackup(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const parsed = JSON.parse(e.target.result);
      if (parsed && Array.isArray(parsed.accounts) && Array.isArray(parsed.transactions)) {
        showConfirmDialog(
          "Restore Backup Data?",
          `Found ${parsed.accounts.length} accounts and ${parsed.transactions.length} transactions in this backup file. Overwrite current data?`,
          () => {
            APP.data = parsed;
            Storage.save(APP.data);
            showToast(t('backup_restored'), "success");
            refreshCurrentView();
          }
        );
      } else {
        showToast(t('invalid_backup'), "error");
      }
    } catch (err) {
      showToast("Error parsing JSON file.", "error");
    }
  };
  reader.readAsText(file);
}

function resetToSampleData() {
  showConfirmDialog(
    "Restore Sample Data?",
    "This will reload the realistic Kerala college student accounts, goals, and transactions.",
    () => {
      APP.data = getDefaultSampleData();
      Storage.save(APP.data);
      showToast(t('data_reset_success'), "success");
      refreshCurrentView();
    }
  );
}

function clearAllData() {
  showConfirmDialog(
    "Clear All Financial Data?",
    "All accounts, transactions, goals, and subscriptions will be permanently erased.",
    () => {
      APP.data = {
        accounts: [],
        transactions: [],
        savingsGoals: [],
        subscriptions: [],
        bills: [],
        loans: [],
        budgets: [],
        studentSettings: { monthlyPocketMoney: 5000, streakDays: 1, lastActiveDate: new Date().toISOString().split('T')[0], noSpendChallengeActive: false }
      };
      Storage.save(APP.data);
      showToast("All data cleared.", "info");
      refreshCurrentView();
    }
  );
}
</script>

<script>
// --- APP ROUTER, MODALS, TOASTS & INITIALIZATION ---

function navigateTo(view) {
  APP.currentView = view;
  
  // Update sidebar and bottom nav active states
  document.querySelectorAll('.nav-btn, .bottom-nav-btn, .drawer-nav-btn').forEach(btn => {
    if (btn.dataset.view === view) {
      btn.classList.add('bg-brand-500/10', 'text-brand-400', 'font-bold');
      btn.classList.remove('text-slate-400');
    } else {
      btn.classList.remove('bg-brand-500/10', 'text-brand-400', 'font-bold');
      btn.classList.add('text-slate-400');
    }
  });

  // Update top bar titles
  const titleMap = {
    dashboard: { title: t('nav_dashboard'), sub: "Real-time college financial health & cash balance" },
    transactions: { title: t('nav_transactions'), sub: "Complete double-entry ledger & passbook" },
    accounts: { title: t('nav_accounts'), sub: "Bank, UPI, Cash & Savings account manager" },
    budgets: { title: t('nav_budgets'), sub: "Category budgets & 30-day balance forecast" },
    savings: { title: t('nav_savings'), sub: "Working ₹30,000 iPhone calculator & targets" },
    subscriptions: { title: t('nav_subscriptions'), sub: "Streaming & software recurring payments" },
    bills: { title: t('nav_bills'), sub: "College fees, hostel mess & utility dues" },
    student_tools: { title: t('nav_student'), sub: "Bus concession, split bills, streaks & badges" },
    borrow_lend: { title: t('nav_loans'), sub: "Borrow & lend tracker for friends & classmates" },
    reports: { title: t('nav_reports'), sub: "Monthly financial audit, CSV export & print statements" },
    audit_rules: { title: t('nav_audit'), sub: "Automated unit test suite verifying all 14 rules" },
    settings: { title: t('nav_settings'), sub: "Language, theme, PIN lock & offline JSON backup" }
  };

  const info = titleMap[view] || { title: view, sub: "" };
  const topTitle = document.getElementById('topBarTitle');
  const topSub = document.getElementById('topBarSubtitle');
  if (topTitle) topTitle.textContent = info.title;
  if (topSub) topSub.textContent = info.sub;

  // Render view
  refreshCurrentView();

  // Close mobile drawer if open
  closeMobileDrawer();

  // Scroll main container to top
  const main = document.getElementById('mainContainer');
  if (main) main.scrollTop = 0;
}

function refreshCurrentView() {
  switch (APP.currentView) {
    case 'dashboard': renderDashboard(); break;
    case 'transactions': renderTransactions(); break;
    case 'accounts': renderAccounts(); break;
    case 'budgets': renderBudgets(); break;
    case 'savings': renderSavingsGoals(); break;
    case 'subscriptions': renderSubscriptions(); break;
    case 'bills': renderBills(); break;
    case 'student_tools': renderStudentTools(); break;
    case 'borrow_lend': renderBorrowLend(); break;
    case 'reports': renderReports(); break;
    case 'audit_rules': renderAuditRules(); break;
    case 'settings': renderSettings(); break;
    default: renderDashboard(); break;
  }
}

// Toast Notification
function showToast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  if (!container) return;

  const toast = document.createElement('div');
  const typeStyles = {
    success: 'bg-emerald-950 border-emerald-500/50 text-emerald-200',
    error: 'bg-rose-950 border-rose-500/50 text-rose-200',
    info: 'bg-slate-900 border-slate-700 text-slate-200'
  };

  toast.className = `p-3 rounded-xl border shadow-xl flex items-center gap-2.5 text-xs font-medium transition-all duration-300 pointer-events-auto transform translate-y-2 opacity-0 ${typeStyles[type] || typeStyles.info}`;
  toast.innerHTML = `
    <i data-lucide="${type === 'success' ? 'check-circle' : (type === 'error' ? 'alert-triangle' : 'info')}" class="w-4 h-4 shrink-0"></i>
    <span class="flex-1">${message}</span>
  `;

  container.appendChild(toast);
  lucide.createIcons();

  requestAnimationFrame(() => {
    toast.classList.remove('translate-y-2', 'opacity-0');
  });

  setTimeout(() => {
    toast.classList.add('opacity-0', 'translate-y-2');
    setTimeout(() => toast.remove(), 300);
  }, 3500);
}

// Confirm Dialog Modal
function showConfirmDialog(title, message, onConfirm) {
  const modalHost = document.getElementById('modalHost');
  modalHost.innerHTML = `
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-sm w-full p-5 shadow-2xl space-y-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center shrink-0">
          <i data-lucide="help-circle" class="w-5 h-5"></i>
        </div>
        <div>
          <h3 class="font-bold text-sm text-white">${title}</h3>
          <p class="text-xs text-slate-400 mt-0.5">${message}</p>
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 pt-3 border-t border-slate-800">
        <button id="btnCancelConfirm" class="px-3.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium transition">Cancel</button>
        <button id="btnProceedConfirm" class="px-4 py-1.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-semibold shadow transition active:scale-95">Confirm</button>
      </div>
    </div>
  `;
  modalHost.classList.remove('hidden');
  lucide.createIcons();

  document.getElementById('btnCancelConfirm').onclick = closeModal;
  document.getElementById('btnProceedConfirm').onclick = () => {
    closeModal();
    if (onConfirm) onConfirm();
  };
}

function closeModal() {
  const modalHost = document.getElementById('modalHost');
  if (modalHost) {
    modalHost.classList.add('hidden');
    modalHost.innerHTML = '';
  }
}

// Mobile Drawer handlers
function openMobileDrawer() {
  document.getElementById('mobileMenuDrawer').classList.remove('hidden');
}
function closeMobileDrawer() {
  const drawer = document.getElementById('mobileMenuDrawer');
  if (drawer) drawer.classList.add('hidden');
}

// Apply Theme
function applyTheme() {
  const html = document.documentElement;
  const themeIcon = document.getElementById('themeIcon');
  if (APP.theme === 'light') {
    html.classList.remove('dark');
    if (themeIcon) themeIcon.setAttribute('data-lucide', 'moon');
  } else {
    html.classList.add('dark');
    if (themeIcon) themeIcon.setAttribute('data-lucide', 'sun');
  }
  lucide.createIcons();
}

// PIN Lock Handling
function checkPinLock() {
  const screen = document.getElementById('pinLockScreen');
  if (APP.pin) {
    APP.isLocked = true;
    APP.enteredPin = '';
    updatePinDots();
    screen.classList.remove('hidden');
  } else {
    APP.isLocked = false;
    screen.classList.add('hidden');
  }
}

function handlePinKey(num) {
  if (APP.enteredPin.length < 4) {
    APP.enteredPin += num;
    updatePinDots();
    if (APP.enteredPin.length === 4) {
      if (APP.enteredPin === APP.pin) {
        // Unlock
        APP.isLocked = false;
        document.getElementById('pinLockScreen').classList.add('hidden');
        showToast("App unlocked!", "success");
      } else {
        document.getElementById('pinErrorMsg').textContent = "Incorrect PIN. Try again.";
        setTimeout(() => {
          APP.enteredPin = '';
          updatePinDots();
          document.getElementById('pinErrorMsg').textContent = '';
        }, 800);
      }
    }
  }
}

function updatePinDots() {
  for (let i = 1; i <= 4; i++) {
    const dot = document.getElementById(`pinDot${i}`);
    if (dot) {
      if (i <= APP.enteredPin.length) {
        dot.className = "w-4 h-4 rounded-full bg-brand-500 border-2 border-brand-500 shadow-sm shadow-brand-500/50";
      } else {
        dot.className = "w-4 h-4 rounded-full border-2 border-slate-600";
      }
    }
  }
}

// --- INITIALIZE APPLICATION ON LOAD ---
document.addEventListener('DOMContentLoaded', () => {
  // Load saved settings
  const settings = Storage.loadSettings();
  APP.lang = settings.lang || 'en';
  APP.theme = settings.theme || 'dark';
  APP.pin = settings.pin || null;

  // Set language label
  document.getElementById('currentLangLabel').textContent = APP.lang === 'ml' ? 'മല' : 'EN';

  // Apply theme
  applyTheme();

  // Load financial data
  APP.data = Storage.load();

  // Setup PIN lock if enabled
  checkPinLock();

  // Setup PIN Keypad Listeners
  document.querySelectorAll('.pin-key[data-num]').forEach(btn => {
    btn.addEventListener('click', () => handlePinKey(btn.dataset.num));
  });
  document.getElementById('btnPinClear').addEventListener('click', () => {
    APP.enteredPin = '';
    updatePinDots();
  });
  document.getElementById('btnPinBackspace').addEventListener('click', () => {
    APP.enteredPin = APP.enteredPin.slice(0, -1);
    updatePinDots();
  });

  // Navigation Button Handlers (Sidebar & Mobile)
  document.querySelectorAll('.nav-btn, .bottom-nav-btn, .drawer-nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const view = btn.dataset.view;
      if (view) navigateTo(view);
    });
  });

  // Mobile Menu Controls
  document.getElementById('btnMobileMenu').addEventListener('click', openMobileDrawer);
  document.getElementById('btnCloseMobileDrawer').addEventListener('click', closeMobileDrawer);
  document.getElementById('mobileDrawerBackdrop').addEventListener('click', closeMobileDrawer);

  // Top Bar Action Controls
  document.getElementById('btnToggleLang').addEventListener('click', () => {
    setLanguage(APP.lang === 'en' ? 'ml' : 'en');
  });

  document.getElementById('btnToggleTheme').addEventListener('click', () => {
    setTheme(APP.theme === 'dark' ? 'light' : 'dark');
  });

  document.getElementById('btnQuickAddTransaction').addEventListener('click', () => {
    openTransactionModal('expense');
  });

  // Streak Counter in Sidebar
  const streakEl = document.getElementById('sidebarStreakCount');
  if (streakEl && APP.data.studentSettings) {
    streakEl.textContent = `${APP.data.studentSettings.streakDays} d streak`;
  }

  // Initial Route
  navigateTo('dashboard');
});
</script>
</body>
</html>
